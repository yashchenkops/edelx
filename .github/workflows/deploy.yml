name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for Pages deploy + artifact upload/finalize.
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      # Re-runs leave old "github-pages" artifacts on the same run_id;
      # deploy-pages then fails with "Multiple artifacts named github-pages".
      - name: Delete stale github-pages artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: context.runId,
              per_page: 100,
            })
            for (const artifact of data.artifacts.filter((a) => a.name === 'github-pages')) {
              core.info(`Deleting stale artifact ${artifact.id}`)
              await github.rest.actions.deleteArtifact({
                owner,
                repo,
                artifact_id: artifact.id,
              })
            }

      # v4 FinalizeArtifact often 403s; v3 is the stable Pages upload path.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
